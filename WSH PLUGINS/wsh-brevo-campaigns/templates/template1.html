        /* Outlook reset */
        table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
        img { border:0; line-height:100%; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
        a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }
        div[style*="margin: 16px 0"] { margin:0 !important; } /* Android Gmail gap fix */
        
        a:hover {
            opacity: 0.8;
        }

        /* L1 – shared */
        .l1-row .l1-col {
            vertical-align: top;
        }

        /* Desktop widths */
        .l1-col-img {
            display: inline-block;
            width: 280px;
            max-width: 280px;
        }

        .l1-col-text {
            display: inline-block;
            width: calc(100% - 300px);
            max-width: 100%;
        }

        /* Img */
        .l1-col-img img {
            display: block;
            width: 280px;
            max-width: 280px;
            height: auto;
            border: 0;
            outline: none;
        }

        /* Text */
        .l1-excerpt {
            margin: 0;
            color: #444;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 20px;
            word-break: normal;
        }

        /* Mobile stack */
        @media only screen and (max-width:600px) {
            .l1-col,
            .l1-col-img,
            .l1-col-text {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
            }

            .l1-col-img img {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
            }

            .l1-cta-wrap {
                text-align: left !important;
                padding-top: 10px !important;
            }
        }
    </style>
